[package]
name = "isorun-app"
description = "Isorun, the game: the front end and the game screen on eframe (egui + wgpu) for the desktop, Android and the web."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "isorun"
path = "src/main.rs"

[dependencies]
isorun-scene = { path = "../scene" }
isorun-webtiles = { path = "../webtiles" }
isorun-render = { path = "../render" }
isorun-client = { path = "../client" }
isorun-ui = { path = "../ui" }
eframe = { workspace = true }
egui = { workspace = true }
wgpu = "30"
serde_json = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 where the browser has no WebGPU
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location"] }
