[package]
name = "isorun-app"
description = "Isorun, the game: the front end and the game screen on eframe (egui + wgpu) for the desktop, Android and the web."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "isorun"
path = "src/main.rs"

[dependencies]
isorun-scene = { path = "../scene" }
isorun-webtiles = { path = "../webtiles" }
isorun-render = { path = "../render" }
isorun-client = { path = "../client" }
isorun-ui = { path = "../ui" }
eframe = { workspace = true }
egui = { workspace = true }
wgpu = "30"
serde_json = { workspace = true }
log = "0.4"
isorun-front = { path = "../front" }
isorun-hud = { path = "../hud" }
isorun-input = { path = "../input" }
isorun-overlays = { path = "../overlays" }
isorun-audio = { path = "../audio" }
isorun-render2d = { path = "../render2d" }
isorun-scene-webtiles = { path = "../scene-webtiles" }
serde = { workspace = true }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"
# AndroidApp, which eframe takes but does not re-export (its native-activity feature is eframe's)
winit = { version = "0.30", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# WebGL2 where the browser has no WebGPU
wgpu = { version = "30", features = ["webgl"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "Location"] }

[features]
default = ["gilrs"]
# real gamepads with gilrs on the desktop and Android (libudev on Linux)
gilrs = ["isorun-input/gilrs"]
