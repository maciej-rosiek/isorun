[package]
name = "isorun-client"
description = "Isorun's client core, with no UI: the servers and accounts, a session's connection and state, the gamedata load, the offline engine, and the platform layer (storage, HTTP, sockets)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
isorun-scene = { path = "../scene" }
isorun-webtiles = { path = "../webtiles" }
isorun-gamedata = { path = "../gamedata" }
isorun-scene-webtiles = { path = "../scene-webtiles" }
isorun-vault = { path = "../vault" }
isorun-render = { path = "../render" }
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
web-time = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tungstenite = { version = "0.27", features = ["rustls-tls-webpki-roots"] }
ureq = "3"
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType", "Window", "Document", "Location", "Storage", "Request", "RequestInit", "Response", "Headers"] }
js-sys = "0.3"

[dev-dependencies]
pollster = "0.4"
wgpu = "30"
