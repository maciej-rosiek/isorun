[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.86"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
regex = "1"
once_cell = "1"
eframe = { version = "0.37", default-features = false, features = ["wgpu", "persistence", "default_fonts", "x11", "wayland", "clipboard", "links", "android-native-activity"] }
egui = "0.37"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
# line tables only: enough for backtraces, and a test binary of a few tens of MB instead of
# hundreds, which the shared target dir (and a small disk) cannot afford across every crate
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

# the web build (native/web/build.sh): small over fast, the browser downloads and compiles it
[profile.web]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
