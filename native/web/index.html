<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="color-scheme" content="dark" />
    <title>Isorun (native)</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0a09;
        color: #c9bfae;
        font-family: 'DejaVu Sans Mono', monospace;
        touch-action: none;
      }
      canvas#isorun {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        outline: none;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: 0.08em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="isorun"></canvas>
    <div id="loading">Loading Isorun…</div>
    <script type="module">
      // the offline engine's bridge first: the app asks it for the engine as it starts (engine.rs `init`)
      import './engine-bridge.js'
      import init from './pkg/isorun_app.js'
      import { startTileWorkers } from './tile-workers.js'
      const loading = document.getElementById('loading')
      try {
        // compiled once, for the page and for the tile workers (tile-workers.js)
        const url = new URL('./pkg/isorun_app_bg.wasm', import.meta.url)
        const response = fetch(url)
        const module = await WebAssembly.compileStreaming(response).catch(async () => WebAssembly.compile(await (await fetch(url)).arrayBuffer()))
        startTileWorkers(module)
        await init({ module_or_path: module })
        loading.remove()
      } catch (e) {
        loading.textContent = `Isorun did not start: ${e}`
        throw e
      }
    </script>
  </body>
</html>
