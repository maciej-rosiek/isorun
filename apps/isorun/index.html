<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: the dungeon view runs to the edges, under the
         status bar and any cutout, and the HUD uses env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <title>Isorun - Dungeon Crawl Stone Soup</title>
    <meta
      name="description"
      content="Play Dungeon Crawl Stone Soup (DCSS) in an isometric view with a gamepad, keyboard or mouse, in your browser, on your own WebTiles account."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Isorun" />
    <meta name="apple-mobile-web-app-title" content="Isorun" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- the wordmark's face (styles.css @font-face) is asked for here, with the stylesheet, not when the
         title is first laid out by the bundle: a round trip later, with the title already on screen in the
         fallback face -->
    <link rel="preload" href="/fonts/grenze-gotisch-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dejavu-sans-mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/dejavu-sans-mono-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/styles.css" />
    <link rel="stylesheet" href="/src/dock.css" />
    <link rel="stylesheet" href="/src/level-up.css" />
    <link rel="stylesheet" href="/src/damage-numbers.css" />
    <link rel="stylesheet" href="/src/touch.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript><p>Isorun needs JavaScript and WebGL to play.</p></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
