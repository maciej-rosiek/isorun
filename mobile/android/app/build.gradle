import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// The version is the game's (apps/isorun/package.json), as for the desktop app.
// versionCode orders the builds for Android's updates: 0.1.5 is 105, 1.2.3 is 10203.
def gameVersion = new JsonSlurper().parse(file('../../../apps/isorun/package.json')).version
def (major, minor, patch) = gameVersion.tokenize('.-').take(3).collect { it as int }

// The release key, from the environment (mobile/README.md). Without one, a release
// build is signed with the debug key: it installs, but cannot update a build signed
// with the release key, nor the other way round.
def keystore = System.getenv('ISORUN_KEYSTORE')

android {
    namespace = "io.github.maciejrosiek.isorun"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "io.github.maciejrosiek.isorun"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode major * 10000 + minor * 100 + patch
        versionName gameVersion
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // the engine and the media are read straight from the APK: compressing them saves little and slows each read
    androidResources {
        noCompress 'wasm', 'data', 'ogg', 'png', 'jpg', 'webp', 'woff2', 'glb'
    }
    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ISORUN_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ISORUN_KEY_ALIAS') ?: 'isorun'
                keyPassword System.getenv('ISORUN_KEY_PASSWORD') ?: System.getenv('ISORUN_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
