name: Build the Isorun native app

# The native app (native/: Rust, egui and wgpu) beside the TypeScript one: the workspace's tests,
# and its packages with the offline engine built natively (engine/native.sh):
#   Isorun-native-linux-x86_64.tar.gz, Isorun-native-x86_64.AppImage (+ .zsync)   native/desktop
#   Isorun-native-win-x64.zip                                                      native/desktop
# kept as the run's artifacts. A published release, or a manual run with "upload", adds them to
# the release (its tag; v<version of apps/isorun/package.json> for a manual run). The APK is
# isorun-native-android.yml's, and the web build is deployed with the hosted page, at /native/
# (isorun-cloudflare.yml).

on:
  push:
    branches: [main]
    paths: ['native/**', 'engine/native.sh', 'engine/patches/**', '.github/workflows/isorun-native.yml']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload:
        description: Add the packages to the release v<version>
        type: boolean
        default: false

concurrency:
  group: isorun-native-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # crawl's make; the runners have 4 cores
  JOBS: 4

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: test
      - run: cargo test --workspace --no-fail-fast
        working-directory: native
      # the web build compiles (crates that only build natively would break it)
      - run: cargo check -p isorun-app --lib --target wasm32-unknown-unknown
        working-directory: native
        env:
          RUSTFLAGS: --cfg getrandom_backend="wasm_js"

  linux:
    # the oldest glibc a runner has, so the binaries run on more systems (SteamOS among them)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libpng-dev zlib1g-dev libsqlite3-dev libncursesw5-dev pkg-config python3-yaml zsync
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: linux
      - name: Engine
        run: engine/native.sh stable
      - name: Smoke test of the engine
        run: |
          cd native
          ISORUN_DATA_DIR=$RUNNER_TEMP/smoke ISORUN_ENGINE_DIR=$GITHUB_WORKSPACE/engine/dist/native/host/engine \
            cargo run -q -p isorun-client --example offline_smoke
      - name: Packages
        run: native/desktop/package.sh linux
      - uses: actions/upload-artifact@v4
        with:
          name: Isorun-native-linux
          path: |
            native/target/release-packages/Isorun-native-linux-x86_64.tar.gz
            native/target/release-packages/Isorun-native-x86_64.AppImage
            native/target/release-packages/Isorun-native-x86_64.AppImage.zsync

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix libpng-dev zlib1g-dev pkg-config python3-yaml zip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: windows
      - name: Engine
        run: engine/native.sh stable --target windows
      - name: Package
        run: native/desktop/package.sh windows
      - uses: actions/upload-artifact@v4
        with:
          name: Isorun-native-windows
          path: native/target/release-packages/Isorun-native-win-x64.zip

  release:
    if: github.event_name == 'release' || inputs.upload
    needs: [test, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Add to the release
        run: |
          tag=${{ github.event.release.tag_name }}
          if [ -z "$tag" ]; then
            tag=v$(node -p "require('./apps/isorun/package.json').version")
          fi
          gh release upload "$tag" packages/* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
