name: Build the Isorun native Android app

# The native app's APK (native/android: the Rust app as a NativeActivity, crawl cross-compiled with
# the NDK), built on every push to main and kept as the run's artifact. A published release, or
# a manual run with "upload", gets it as Isorun.apk: it replaces the Capacitor app
# (isorun-android.yml, now run by hand only). The Capacitor app's id and release key (the
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets, mobile/README.md; the debug key
# without them), so it installs over that app.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload:
        description: Add Isorun.apk to the release v<version>
        type: boolean
        default: false

concurrency:
  group: isorun-native-android-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  JOBS: 4

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libpng-dev zlib1g-dev pkg-config python3-yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android
      - name: Release key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            exit 0
          fi
          # a secret pasted on a phone often carries a line break, or spaces in the base64
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/isorun.keystore"
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          if ! keytool -list -keystore "$RUNNER_TEMP/isorun.keystore" -storepass "$password" > /dev/null; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore in ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "ISORUN_KEYSTORE=$RUNNER_TEMP/isorun.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          echo "ISORUN_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: APK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          native/android/build.sh aarch64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Isorun-android
          path: native/target/release-packages/Isorun.apk
      - name: Add to the release
        if: github.event_name == 'release' || inputs.upload
        run: |
          tag=${{ github.event.release.tag_name }}
          if [ -z "$tag" ]; then
            tag=v$(node -p "require('./apps/isorun/package.json').version")
          fi
          gh release upload "$tag" native/target/release-packages/Isorun.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}
