name: Build the Isorun native Android app

# The native app's APK (native/android: the Rust app as a NativeActivity, crawl cross-compiled with
# the NDK), built on every push to main and kept as the run's artifact. A published release, or
# a manual run with "upload", gets it as Isorun.apk: it replaces the Capacitor app
# (isorun-android.yml, now run by hand only). The Capacitor app's id and release key (the
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets, mobile/README.md; the debug key
# without them), so it installs over that app.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      upload:
        description: Add Isorun.apk to the release v<version>
        type: boolean
        default: false

# a run in progress finishes (its emulator smoke is the check that matters); only the newest
# push waits behind it, the ones between are dropped
concurrency:
  group: isorun-native-android-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  JOBS: 4

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libpng-dev zlib1g-dev pkg-config python3-yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: android
      - name: Release key
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with the debug key."
            exit 0
          fi
          # a secret pasted on a phone often carries a line break, or spaces in the base64
          printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/isorun.keystore"
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          if ! keytool -list -keystore "$RUNNER_TEMP/isorun.keystore" -storepass "$password" > /dev/null; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD does not open the keystore in ANDROID_KEYSTORE_BASE64."
            exit 1
          fi
          echo "ISORUN_KEYSTORE=$RUNNER_TEMP/isorun.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$password"
          echo "ISORUN_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      - name: APK
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018
          native/android/build.sh aarch64 x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: Isorun-android
          path: native/target/release-packages/Isorun.apk
      # what the smoke job plays on the emulator: the client's offline_smoke for x86_64, crawl
      # beside it as libcrawl.so, and the engine's folder
      - name: Smoke kit
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK/x86_64-linux-android26-clang
          export CC_x86_64_linux_android=$NDK/x86_64-linux-android26-clang AR_x86_64_linux_android=$NDK/llvm-ar
          (cd native && cargo build --release -p isorun-client --example offline_smoke --target x86_64-linux-android)
          kit=$RUNNER_TEMP/smoke
          mkdir -p "$kit"
          cp native/target/x86_64-linux-android/release/examples/offline_smoke "$kit/"
          cp engine/dist/native/android-x86_64/engine/crawl "$kit/libcrawl.so"
          (cd engine/dist/native/android-x86_64 && tar --exclude ./engine/crawl -cf - ./engine) | (cd "$kit" && tar -xf -)
          # the APK again, debuggable and with offline_smoke as libsmoke.so, for run-as
          cp "$kit/offline_smoke" native/android/build/stage/jniLibs/x86_64/libsmoke.so
          version=$(node -p "require('./apps/isorun/package.json').version")
          code=$(echo "$version" | awk -F. '{ print $1 * 10000 + $2 * 100 + $3 }')
          (cd native/android && gradle --no-daemon -q assembleRelease -PisorunVersion="$version" -PisorunVersionCode="$code" -PisorunDebuggable=true)
          cp native/android/app/build/outputs/apk/release/app-release.apk "$kit/Isorun-smoke.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-kit
          path: ${{ runner.temp }}/smoke
          retention-days: 3
      - name: Add to the release
        if: github.event_name == 'release' || inputs.upload
        run: |
          tag=${{ github.event.release.tag_name }}
          if [ -z "$tag" ]; then
            tag=v$(node -p "require('./apps/isorun/package.json').version")
          fi
          gh release upload "$tag" native/target/release-packages/Isorun.apk --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The APK on an x86_64 emulator (a phone's size, 411 x 914 dp): crawl from a shell, then the app
  # itself (native/android/smoke.sh). Its logcat and screenshots are the run's smoke-out artifact.
  smoke:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Isorun-android
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: smoke-kit
          path: smoke
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: sh native/android/smoke.sh apk/Isorun.apk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out
          path: smoke-out
          retention-days: 7
