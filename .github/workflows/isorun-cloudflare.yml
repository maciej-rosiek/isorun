name: Deploy Isorun to Cloudflare

# The hosted game (https://isorun.maciej-rosiek.workers.dev): the static build, the gamedata proxy
# and the visit counts in one Worker, and the native app's web build at /native/ (native/web). The offline engine is not hosted, so the build offers no offline play. Needs the CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and
# CLOUDFLARE_ACCOUNT_ID repository secrets, and ISORUN_STATS_KEY for the /stats page.

on:
  push:
    branches: [main]
    paths-ignore: ['engine/**']
  workflow_dispatch:

concurrency:
  group: isorun-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run --exclude packages/offline/test/engine.test.ts
      - run: npm run build
        env:
          VITE_OFFLINE: 'off'
      # the native app's web build (native/web), served beside the TypeScript build at /native/;
      # a failure there leaves the page deployed without it
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: web
      - name: wasm-bindgen
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' native/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Native web build
        continue-on-error: true
        run: native/web/build.sh apps/isorun/dist/native
      - name: Deploy
        run: |
          printf 'STATS_KEY=%s\n' "$STATS_KEY" > .stats-secrets.env
          npx wrangler deploy --secrets-file .stats-secrets.env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_KEY: ${{ secrets.ISORUN_STATS_KEY }}
