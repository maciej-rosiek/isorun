name: Deploy Isorun to Cloudflare

# The hosted page (https://isorun.maciej-rosiek.workers.dev): the app's web build (native/web) at
# the site's root, the gamedata and morgue proxies and the visit counts in one Worker (worker/,
# wrangler.jsonc). The offline engine is not hosted (/engine/* is a 404), so the page offers no
# offline games. Needs the CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID
# repository secrets, and ISORUN_STATS_KEY for the /stats page.

on:
  push:
    branches: [main]
    paths-ignore: ['engine/**', 'native/android/**', 'native/desktop/**']
  workflow_dispatch:

concurrency:
  group: isorun-cloudflare
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # the Worker and the engine bridge: types and tests
      - run: npx tsc -p .
      - run: npx vitest run
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: web
      - name: wasm-bindgen
        id: bindgen
        run: echo "version=$(grep -A1 '^name = "wasm-bindgen"$' native/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Web build
        run: native/web/build.sh native/web/dist
      - name: Deploy
        run: |
          printf 'STATS_KEY=%s\n' "$STATS_KEY" > .stats-secrets.env
          npx wrangler deploy --secrets-file .stats-secrets.env
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STATS_KEY: ${{ secrets.ISORUN_STATS_KEY }}
      # the deployed page: the build's own page at /, and the web build's old place sent home
      - name: Live check
        run: |
          base=https://isorun.maciej-rosiek.workers.dev
          pkg=$(ls -d native/web/dist/pkg-* | xargs -n1 basename)
          for i in 1 2 3 4 5 6; do
            curl -fsS "$base/" | grep -q "$pkg/isorun_app.js" && break
            [ "$i" = 6 ] && { echo "::error::$base/ does not serve $pkg"; exit 1; }
            sleep 10
          done
          echo "/ serves $pkg"
          curl -sS -o /dev/null -w '/native/ -> %{http_code} %{redirect_url}\n' "$base/native/" | tee native.txt
          grep -q "^/native/ -> 301 $base/$" native.txt
          curl -fsS -o /dev/null -w '/audio/sfx/hit1.ogg -> %{http_code}\n' "$base/audio/sfx/hit1.ogg"
          curl -sS -o /dev/null -w '/engine/stable/engine.json -> %{http_code}\n' "$base/engine/stable/engine.json"
